[package]
name = "nsga_rs"
version = "1.4.1"
authors = [
    "Stefano Simoncelli <16114781+s-simoncelli@users.noreply.github.com>",
]
edition = "2021"
rust-version = "1.80"
description = "A Rust implementation of the NSGA family of multi-objective evolutionary algorithms"
repository = "https://github.com/s-simoncelli/nsga_rs"
keywords = [
    "genetic-algorithm",
    "optimisation",
    "multiobjective",
    "nsga2",
    "nsga3",
]
categories = ["science", "algorithms"]
readme = "README.md"
license = "MIT"

[workspace]
resolver = "2"
members = ["libs/nsga-rs-macros", "libs/hv-fonseca-et-al-2006-sys"]
default-members = ["libs/nsga-rs-macros", "libs/hv-fonseca-et-al-2006-sys"]

[lib]
name = "nsga_rs"

[dependencies]
log = "0.4.21"
serde_json = "1.0"
serde = { version = "1.0.200", features = ["derive"] }
rand = "0.9.0"
rand_chacha = "0.9.0"
thiserror = "2.0.11"
rayon = "1.10.0"
env_logger = "0.11.3"
chrono = { version = "0.4.38", features = ["serde"] }
nsga-rs-macros = { path = "libs/nsga-rs-macros", version = "1.2.0" }
hv-fonseca-et-al-2006-sys = { path = "libs/hv-fonseca-et-al-2006-sys", version = "2.0.2-rc.2" }
nalgebra = "0.33.0"
pyo3 = { version = ">=0.28.0", optional = true, features = [] }
pyo3-build-config = { version = ">=0.28.0", optional = true }
gnuplot = { version = "0.0.46", optional = true }

[dev-dependencies]
float-cmp = "0.10.0"

[features]
default = ["plotting"]
plotting = ["gnuplot"]
python = ["dep:pyo3", "dep:pyo3-build-config", "pyo3/chrono"]
# Enable pyo3 support when creating a Python module that wraps this library with an 
# optimisation problem
python-module = ["python", "pyo3/extension-module"]
# feature used only to test python function
python-test = ["python", "pyo3/auto-initialize"]

[package.metadata.docs.rs]
all-features = true
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--html-in-header", "src/katex-header.html"]

# Run test with optimisation to speed up tests solving optimisation problems.
[profile.test]
opt-level = 3
